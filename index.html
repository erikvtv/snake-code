<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake 3D</title>
<style>
  :root {
    --bg: #F6F9FE;
    --navy: #0E2E5D;
    --lime: #C7D300;
    --orange: #FBB900;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at 50% 30%, #ffffff 0%, var(--bg) 60%, #DCE6F5 100%);
    color: var(--navy);
    font-family: Arial, sans-serif;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: 6px; }
  .hud { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .chip {
    background: var(--navy);
    color: #fff;
    padding: 8px 14px;
    border-radius: 999px;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(14, 46, 93, 0.25);
  }
  .chip b { color: var(--lime); }
  .speed { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit;
    font-weight: bold;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: var(--orange);
    color: var(--navy);
    cursor: pointer;
    box-shadow: 0 3px 0 #C99400;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #C99400; }
  .stage { position: relative; }
  canvas { display: block; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(14, 46, 93, 0.35);
    border-radius: 14px;
  }
  .overlay.hidden { display: none; }
  .card {
    background: #fff;
    border-left: 6px solid var(--lime);
    border-radius: 16px;
    padding: 20px 36px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(14, 46, 93, 0.35);
  }
  .card h2 { margin: 0 0 8px; font-size: 32px; }
  .card p { margin: 0; }
  .pop {
    position: absolute;
    transform: translate(-50%, -50%);
    font-weight: bold;
    font-size: 22px;
    color: var(--navy);
    text-shadow: 0 2px 0 #fff;
    pointer-events: none;
    animation: float-up 0.9s ease-out forwards;
  }
  @keyframes float-up {
    to { transform: translate(-50%, -150%); opacity: 0; }
  }
  .help { font-size: 14px; opacity: 0.7; text-align: center; padding: 0 16px; }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
</script>
</head>
<body>
  <h1>SNAKE 3D</h1>
  <div class="hud">
    <div class="chip">Score <b id="score">0</b></div>
    <div class="chip">Beste <b id="best">0</b></div>
    <div class="speed">
      <button id="slower" title="Langzamer (Z)">−</button>
      <div class="chip">Snelheid <b id="speed">1</b></div>
      <button id="faster" title="Sneller (X)">+</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="overlay hidden" id="overlay">
      <div class="card"><h2 id="overlay-title"></h2><p id="overlay-text"></p></div>
    </div>
  </div>
  <div class="help">Pijltjes of WASD om te sturen · Z langzamer / X sneller · Spatie pauze · Enter opnieuw</div>

<script type="module">
  import * as THREE from "three";
  import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

  // Spelinstellingen
  const GRID_SIZE = 20;
  const MIN_SPEED = 1;
  const MAX_SPEED = 10;
  const BASE_INTERVAL_MS = 220;
  const INTERVAL_STEP_MS = 20;
  const BEST_KEY = "snake-best";
  const CAMERA_POS = new THREE.Vector3(0, 27, 18);

  const el = (id) => document.getElementById(id);
  const DIRECTIONS = {
    ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 },
  };

  let state;
  let speed = 1;
  let best = loadBest();
  let shake = 0;
  let lastFrame = performance.now();
  let overlayKey = "";

  // ---------- Spellogica ----------

  // Opslag kan geblokkeerd zijn (privévenster); het spel werkt dan gewoon zonder
  function loadBest() {
    try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem(BEST_KEY, String(best)); } catch { /* negeren */ }
  }

  const interval = () => BASE_INTERVAL_MS - (speed - 1) * INTERVAL_STEP_MS;
  const lerp = (a, b, t) => a + (b - a) * t;
  // Rastercoördinaat naar wereldcoördinaat, met het bord gecentreerd rond de oorsprong
  const toWorld = (v) => v - GRID_SIZE / 2 + 0.5;

  function newState() {
    const mid = Math.floor(GRID_SIZE / 2);
    const snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    return {
      snake,
      prevSnake: snake.map((p) => ({ ...p })),
      direction: { x: 1, y: 0 },
      // Wachtrij zodat twee snelle toetsaanslagen binnen één tick niet tot omkeren leiden
      queue: [],
      food: randomFood(snake),
      score: 0,
      isOver: false,
      isPaused: false,
      lastTick: performance.now(),
    };
  }

  function randomFood(snake) {
    const free = [];
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        if (!snake.some((p) => p.x === x && p.y === y)) free.push({ x, y });
      }
    }
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function queueDirection(dir) {
    const last = state.queue.length ? state.queue[state.queue.length - 1] : state.direction;
    const isOpposite = dir.x === -last.x && dir.y === -last.y;
    const isSame = dir.x === last.x && dir.y === last.y;
    // Niet recht terug in jezelf, en geen dubbele invoer
    if (isOpposite || isSame) return;
    if (state.queue.length < 3) state.queue.push(dir);
  }

  function step() {
    if (state.queue.length) state.direction = state.queue.shift();
    const head = state.snake[0];
    const next = { x: head.x + state.direction.x, y: head.y + state.direction.y };
    const willEat = state.food && next.x === state.food.x && next.y === state.food.y;
    // De staart schuift op, dus die cel telt niet als botsing tenzij we groeien
    const body = willEat ? state.snake : state.snake.slice(0, -1);
    const hitsWall = next.x < 0 || next.y < 0 || next.x >= GRID_SIZE || next.y >= GRID_SIZE;
    const hitsSelf = body.some((p) => p.x === next.x && p.y === next.y);
    if (hitsWall || hitsSelf) return endGame();

    state.prevSnake = state.snake.map((p) => ({ ...p }));
    state.snake.unshift(next);
    if (willEat) eat(next);
    else state.snake.pop();
  }

  function eat(pos) {
    state.score += 1;
    if (state.score > best) { best = state.score; saveBest(); }
    spawnBurst(toWorld(pos.x), toWorld(pos.y));
    showPop(toWorld(pos.x), toWorld(pos.y));
    state.food = randomFood(state.snake);
    if (!state.food) state.isOver = true;
  }

  function endGame() {
    state.isOver = true;
    state.prevSnake = state.snake.map((p) => ({ ...p }));
    shake = 0.6;
  }

  // ---------- 3D-scène ----------

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  const segmentGeometry = new RoundedBoxGeometry(0.86, 0.86, 0.86, 3, 0.22);
  const segments = [];
  const particles = [];
  const pupilMaterial = new THREE.MeshStandardMaterial({ color: "#0E2E5D" });
  let head;
  let food;

  function createScene() {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.style.borderRadius = "14px";
    el("stage").prepend(renderer.domElement);

    camera.position.copy(CAMERA_POS);
    camera.lookAt(0, 0, 0.5);

    scene.add(new THREE.HemisphereLight("#ffffff", "#B8C7E0", 1.6));
    const sun = new THREE.DirectionalLight("#ffffff", 2.2);
    sun.position.set(8, 20, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
    sun.shadow.radius = 4;
    scene.add(sun);
    resize();
  }

  function checkerTexture() {
    const size = 512;
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext("2d");
    const cell = size / GRID_SIZE;
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? "#FFFFFF" : "#E4ECF8";
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
  }

  function createBoard() {
    const base = new THREE.Mesh(
      new RoundedBoxGeometry(GRID_SIZE + 1.6, 1.2, GRID_SIZE + 1.6, 3, 0.3),
      new THREE.MeshStandardMaterial({ color: "#0E2E5D", roughness: 0.6 })
    );
    base.position.y = -0.6;
    base.receiveShadow = true;
    scene.add(base);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE),
      new THREE.MeshStandardMaterial({ map: checkerTexture(), roughness: 0.9 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    const wallMaterial = new THREE.MeshStandardMaterial({ color: "#C7D300", roughness: 0.5 });
    const half = GRID_SIZE / 2 + 0.25;
    const walls = [[0, -half, GRID_SIZE + 1, 0.5], [0, half, GRID_SIZE + 1, 0.5],
                   [-half, 0, 0.5, GRID_SIZE], [half, 0, 0.5, GRID_SIZE]];
    for (const [x, z, w, d] of walls) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 0.5, d), wallMaterial);
      wall.position.set(x, 0.25, z);
      wall.castShadow = wall.receiveShadow = true;
      scene.add(wall);
    }
  }

  function createHead() {
    head = new THREE.Group();
    const skull = new THREE.Mesh(
      new RoundedBoxGeometry(0.98, 0.9, 0.98, 3, 0.3),
      new THREE.MeshStandardMaterial({ color: "#0E2E5D", roughness: 0.35 })
    );
    skull.castShadow = true;
    head.add(skull);
    const eyeGeometry = new THREE.SphereGeometry(0.15, 16, 12);
    const pupilGeometry = new THREE.SphereGeometry(0.075, 12, 8);
    const eyeMaterial = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.2 });
    for (const side of [-1, 1]) {
      const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
      eye.position.set(side * 0.22, 0.28, 0.32);
      const pupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
      pupil.position.set(side * 0.22, 0.3, 0.44);
      head.add(eye, pupil);
    }
    scene.add(head);
  }

  function createFood() {
    food = new THREE.Group();
    const fruit = new THREE.Mesh(
      new THREE.SphereGeometry(0.36, 24, 16),
      new THREE.MeshStandardMaterial({ color: "#FBB900", emissive: "#F29A00", emissiveIntensity: 0.35, roughness: 0.4 })
    );
    fruit.castShadow = true;
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03, 0.03, 0.18),
      new THREE.MeshStandardMaterial({ color: "#6B4A1F" })
    );
    stem.position.y = 0.4;
    const leaf = new THREE.Mesh(
      new THREE.SphereGeometry(0.14, 12, 8),
      new THREE.MeshStandardMaterial({ color: "#C7D300" })
    );
    leaf.scale.set(1, 0.3, 0.55);
    leaf.position.set(0.13, 0.44, 0);
    const glow = new THREE.PointLight("#FBB900", 3, 3);
    food.add(fruit, stem, leaf, glow);
    scene.add(food);
  }

  function createParticles() {
    const geometry = new THREE.BoxGeometry(0.14, 0.14, 0.14);
    const colors = ["#FBB900", "#C7D300", "#FFD75E", "#ffffff"];
    for (let i = 0; i < 40; i++) {
      const material = new THREE.MeshStandardMaterial({ color: colors[i % colors.length], transparent: true });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.visible = false;
      scene.add(mesh);
      particles.push({ mesh, velocity: new THREE.Vector3(), life: 0 });
    }
  }

  function resize() {
    const size = Math.min(560, window.innerWidth - 32);
    renderer.setSize(size, size);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
  }

  // ---------- Animatie per frame ----------

  function snakePoints(t) {
    const prev = state.prevSnake;
    return state.snake.map((p, i) => {
      const from = prev[i] || prev[prev.length - 1];
      return { x: toWorld(lerp(from.x, p.x, t)), z: toWorld(lerp(from.y, p.y, t)) };
    });
  }

  function addSegment() {
    const mesh = new THREE.Mesh(segmentGeometry, new THREE.MeshStandardMaterial({ roughness: 0.35 }));
    mesh.castShadow = true;
    scene.add(mesh);
    segments.push(mesh);
  }

  function syncSnake(t) {
    const pts = snakePoints(t);
    const n = pts.length;
    while (segments.length < n - 1) addSegment();
    while (segments.length > n - 1) scene.remove(segments.pop());

    for (let i = 1; i < n; i++) {
      const k = i / n;
      const mesh = segments[i - 1];
      const scale = 1 - k * 0.3;
      mesh.position.set(pts[i].x, 0.43 * scale, pts[i].z);
      mesh.scale.setScalar(scale);
      mesh.material.color.setHSL((215 - k * 10) / 360, (70 - k * 20) / 100, (24 + k * 30) / 100);
    }
    const d = state.direction;
    head.position.set(pts[0].x, 0.45, pts[0].z);
    head.rotation.y = Math.atan2(d.x, d.y);
    pupilMaterial.color.set(state.isOver ? "#E5484D" : "#0E2E5D");
  }

  function animateFood(now) {
    food.visible = Boolean(state.food);
    if (!state.food) return;
    food.position.set(toWorld(state.food.x), 0.5 + Math.sin(now / 250) * 0.12, toWorld(state.food.y));
    food.rotation.y = now / 600;
    food.scale.setScalar(1 + Math.sin(now / 180) * 0.06);
  }

  function spawnBurst(x, z) {
    let spawned = 0;
    for (const p of particles) {
      if (p.life > 0 || spawned >= 18) continue;
      const angle = Math.random() * Math.PI * 2;
      p.velocity.set(Math.cos(angle) * 2.5, 3 + Math.random() * 3, Math.sin(angle) * 2.5);
      p.mesh.position.set(x, 0.5, z);
      p.life = 1;
      p.mesh.visible = true;
      spawned++;
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      if (p.life <= 0) continue;
      p.velocity.y -= 12 * dt;
      p.mesh.position.addScaledVector(p.velocity, dt);
      p.mesh.rotation.x += 6 * dt;
      p.mesh.rotation.y += 4 * dt;
      p.life -= 1.4 * dt;
      p.mesh.material.opacity = Math.max(0, p.life);
      p.mesh.visible = p.life > 0;
    }
  }

  function showPop(x, z) {
    const point = new THREE.Vector3(x, 1, z).project(camera);
    const size = renderer.domElement.clientWidth;
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.textContent = "+1";
    pop.style.left = `${(point.x + 1) / 2 * size}px`;
    pop.style.top = `${(1 - point.y) / 2 * size}px`;
    pop.addEventListener("animationend", () => pop.remove());
    el("stage").append(pop);
  }

  function updateOverlay() {
    const key = state.isOver ? `over-${state.score}` : state.isPaused ? "paused" : "";
    if (key === overlayKey) return;
    overlayKey = key;
    el("overlay").classList.toggle("hidden", key === "");
    el("overlay-title").textContent = state.isOver ? "Game over" : "Pauze";
    el("overlay-text").textContent = state.isOver
      ? `Score ${state.score} · Enter = opnieuw`
      : "Spatie om verder te gaan";
  }

  function render(now, dt) {
    const frozen = state.isOver || state.isPaused;
    const t = frozen ? 1 : Math.min(1, (now - state.lastTick) / interval());
    syncSnake(t);
    animateFood(now);
    updateParticles(dt);

    camera.position.copy(CAMERA_POS);
    if (shake > 0.01) {
      camera.position.x += (Math.random() - 0.5) * shake;
      camera.position.y += (Math.random() - 0.5) * shake;
      shake *= 0.9;
    }
    renderer.render(scene, camera);

    updateOverlay();
    el("score").textContent = state.score;
    el("best").textContent = best;
    el("speed").textContent = speed;
  }

  function loop(now) {
    if (!state.isOver && !state.isPaused && now - state.lastTick >= interval()) {
      state.lastTick = now;
      step();
    }
    render(now, Math.min(0.05, (now - lastFrame) / 1000));
    lastFrame = now;
    requestAnimationFrame(loop);
  }

  // ---------- Invoer ----------

  function changeSpeed(delta) {
    speed = Math.min(MAX_SPEED, Math.max(MIN_SPEED, speed + delta));
  }

  function handleKey(e) {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (DIRECTIONS[key]) {
      e.preventDefault();
      if (!state.isOver && !state.isPaused) queueDirection(DIRECTIONS[key]);
    } else if (key === "x" || key === "+" || key === "=") {
      changeSpeed(1);
    } else if (key === "z" || key === "-" || key === "_") {
      changeSpeed(-1);
    } else if (key === " ") {
      e.preventDefault();
      if (!state.isOver) state.isPaused = !state.isPaused;
      state.lastTick = performance.now();
    } else if (key === "Enter") {
      state = newState();
    }
  }

  document.addEventListener("keydown", handleKey);
  window.addEventListener("resize", resize);
  el("faster").addEventListener("click", () => changeSpeed(1));
  el("slower").addEventListener("click", () => changeSpeed(-1));

  createScene();
  createBoard();
  createHead();
  createFood();
  createParticles();
  state = newState();
  requestAnimationFrame(loop);
</script>
</body>
</html>
